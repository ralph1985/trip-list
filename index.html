<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="Listas sencillas para no olvidar nada antes de viajar." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>TripList</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">TripList</p>
          <h1>Antes de salir</h1>
          <p class="intro">Tu lista de viaje, sin ruido y siempre a mano.</p>
        </div>
        <button class="icon-button" id="reset-button" type="button" title="Desmarcar toda la lista" aria-label="Desmarcar toda la lista">↺</button>
      </header>

      <section class="summary" aria-label="Progreso">
        <div class="summary-line">
          <span id="progress-label">0 de 0 listos</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <button class="filter-button" id="completed-toggle" type="button" aria-pressed="false">Ocultar completados</button>
      </section>

      <nav class="section-nav" id="section-nav" aria-label="Secciones de la lista"></nav>

      <section class="list-area">
        <div class="list-heading">
          <div>
            <p class="section-kicker">Sección actual</p>
            <h2 id="section-title">Otros</h2>
          </div>
        </div>
        <ul class="checklist" id="checklist"></ul>
      </section>

      <p class="storage-note">Se guarda automáticamente en este dispositivo.</p>
    </main>
    <script id="list-definition" type="application/json">
      [
        {"name":"Otros","items":["Bolsa de plástico","Botella agua Decathlon"]},
        {"name":"Casa","items":["Activar cámara de seguridad","Activar cámara 2","Cerrar rejas","Abrir rejas","Preparativos lluvia","Apagar y desenchufar regletas","Cerrar velux","Gotera velux","¿Está el microondas vacío?","¿Luces apagadas?","Apagar aire acondicionado"]},
        {"name":"Bici","items":["Zapatillas con calas","Calcetines","Culot","Separador de ropa para lavar el culot","Casco","Pantalón corto","Guantes","Mochila hidratación","Botella","Garmin","Cargador Garmin","Desengrasante","Aparato azul desengrasante","Cera cadena","Limpiahorquillas","Trapos","Detergente"]},
        {"name":"Trekking","items":["Zapatillas Salomón","Botas Salomón","Palos","Mochila","Navaja","Impermeable","Crema rozaduras (culito bebé)","Compeed (rozaduras)","Malla fina caminatas","Mochila hidratación deporte","Cantimplora","Vaselina","Braga para correr"]},
        {"name":"Clima","items":["Paraguas","Impermeable","Chubasquero","Gorro","Guantes","Botas"]},
        {"name":"Medicamentos","items":["Coligas","Paracetamol","Biodramina","Omeprazol","Mascarillas","Termómetro","Probióticos","Homeopatía"]},
        {"name":"Coche","items":["Cargador y soportes móvil para el coche","Inflador ruedas coche","Telepeaje"]},
        {"name":"Cargadores y energía","items":["Enchufes Costa Rica (en mochila mavic)","Cargador móvil","Batería portátil","Cargador Android"]},
        {"name":"Audio","items":["Airpods","Cascos dormir"]},
        {"name":"Drone","items":["Drone","Mando drone","Aspas drone","Baterías drone","Cargar baterías drone","Cargar mando drone"]},
        {"name":"Cámaras","items":["GoPro","Cargar GoPro","Liberar espacio GoPro","Cámara Lumix","Cargador baterías Lumix"]},
        {"name":"Ordenadores","items":["Macbook (curro)","Cargador Macbook","MSI (portátil personal)","Cargador portátil MSI"]},
        {"name":"Ocio digital","items":["Libro","Descargar capítulos de series","Descargar películas","Descargar Netflix","Descargar podcasts"]},
        {"name":"Cuidado personal","items":["Maquinilla de afeitar"]},
        {"name":"Reloj deportivo","items":["Reloj Garmin","Cargador Garmin"]},
        {"name":"Baño y playa","items":["Bañador","Tapones oídos","Toallas playa","Toalla microfibra (por si no hay en el hostal/hotel)","Chanclas","Gafas buceo","Crema solar","Escarpines","Bolso naranja impermeable","Gorro de baño"]},
        {"name":"Picnic","items":["Mesa y sillas","Silla Decathlon","Nevera","Servilletas","Cubiertos","Refrescos","Manta suelo","Bolsas de basura","Crema","Gorros","Palillos"]},
        {"name":"Juegos","items":["Rumi","Virus","Sushi go","Twister"]},
        {"name":"Salud","items":["Gafas secundarias","Férula","Saquito de semillas","Semillas de lino"]},
        {"name":"Higiene","items":["Cepillos interdentales"]},
        {"name":"Llaves","items":["Llaves de Palomares","Llaves de Cuenca","Mando garaje Cuenca (en la furgoneta)","Llaves de Getafe","Llaves de Meco"]},
        {"name":"Documentación y dinero","items":["Dinero en efectivo","Cartera DNI","Pasaporte"]},
        {"name":"Ropa","items":["Cinturón"]},
        {"name":"Equipaje","items":["Nueva mochila Toledo","Nevera para tuppers"]}
      ]
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
